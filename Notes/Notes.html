<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Tukka Sticky Notes App</title>

    <!-- FONT AWESOME -->

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        min-height: 100vh;
        background: linear-gradient(135deg, #0f172a, #111827, #1e293b);
        overflow: hidden;
        color: white;
      }

      /* HEADER */

      header {
        position: sticky;
        top: 0;
        z-index: 1000;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .header-container {
        width: 92%;
        max-width: 1400px;
        margin: auto;
        padding: 22px 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        flex-wrap: wrap;
      }

      .logo {
        font-size: 2rem;
        font-weight: bold;
        color: #38bdf8;
      }

      .add-note-btn {
        border: none;
        padding: 16px 24px;
        border-radius: 18px;
        background: #38bdf8;
        color: #0f172a;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
        box-shadow: 0 12px 30px rgba(56, 189, 248, 0.25);
      }

      .add-note-btn:hover {
        transform: translateY(-4px);
        background: #0ea5e9;
      }

      /* WORKSPACE */

      .workspace {
        position: relative;
        width: 100%;
        height: calc(100vh - 100px);
        overflow: hidden;
      }

      /* EMPTY MESSAGE */

      .empty-message {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        color: #94a3b8;
        line-height: 2;
        pointer-events: none;
      }

      .empty-message i {
        font-size: 5rem;
        margin-bottom: 20px;
        color: #38bdf8;
      }

      /* NOTE */

      .note {
        position: absolute;
        width: 320px;
        min-height: 240px;
        border-radius: 28px;
        padding: 20px;
        cursor: grab;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
        display: flex;
        flex-direction: column;
        user-select: none;
        transition: box-shadow 0.2s;
        animation: pop 0.3s ease;
      }

      @keyframes pop {
        from {
          transform: scale(0.8);
          opacity: 0;
        }

        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      .note:active {
        cursor: grabbing;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      }

      /* NOTE HEADER */

      .note-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 18px;
        gap: 10px;
      }

      .note-title {
        font-size: 1.1rem;
        font-weight: bold;
        width: 100%;
        background: transparent;
        border: none;
        outline: none;
        color: #111827;
      }

      /* NOTE ACTIONS */

      .note-actions {
        display: flex;
        gap: 10px;
      }

      .icon-btn {
        width: 40px;
        height: 40px;
        border: none;
        border-radius: 14px;
        cursor: pointer;
        font-size: 1rem;
        transition: 0.3s;
        color: white;
      }

      .edit-btn {
        background: #0f172a;
      }

      .delete-btn {
        background: #ef4444;
      }

      .icon-btn:hover {
        transform: scale(1.08);
      }

      /* NOTE TEXT */

      .note-content {
        flex: 1;
        width: 100%;
        resize: none;
        border: none;
        outline: none;
        background: transparent;
        color: #111827;
        font-size: 1rem;
        line-height: 1.8;
        overflow: auto;
      }

      /* FOOTER */

      .note-footer {
        margin-top: 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .time {
        font-size: 0.85rem;
        color: #334155;
      }

      .color-picker {
        width: 40px;
        height: 40px;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        overflow: hidden;
        background: none;
      }

      /* MODAL */

      .modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        opacity: 0;
        visibility: hidden;
        transition: 0.3s;
        z-index: 2000;
      }

      .modal.active {
        opacity: 1;
        visibility: visible;
      }

      .modal-box {
        width: 100%;
        max-width: 550px;
        background: #111827;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 30px;
        padding: 30px;
        position: relative;
        animation: popup 0.3s ease;
      }

      @keyframes popup {
        from {
          transform: translateY(40px);
          opacity: 0;
        }

        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      .modal-title {
        font-size: 2rem;
        margin-bottom: 12px;
      }

      .modal-description {
        color: #94a3b8;
        line-height: 1.8;
        margin-bottom: 25px;
      }

      /* FORM */

      .form-group {
        margin-bottom: 20px;
      }

      .form-group label {
        display: block;
        margin-bottom: 10px;
        color: #cbd5e1;
      }

      .form-group input,
      .form-group textarea {
        width: 100%;
        border: none;
        outline: none;
        background: #0f172a;
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: white;
        padding: 16px;
        border-radius: 18px;
        font-size: 1rem;
      }

      .form-group textarea {
        min-height: 140px;
        resize: none;
      }

      .modal-footer {
        display: flex;
        justify-content: flex-end;
        gap: 15px;
        margin-top: 10px;
        flex-wrap: wrap;
      }

      .modal-btn {
        border: none;
        padding: 15px 22px;
        border-radius: 16px;
        cursor: pointer;
        font-weight: bold;
        transition: 0.3s;
      }

      .cancel-btn {
        background: #1e293b;
        color: white;
      }

      .save-btn {
        background: #38bdf8;
        color: #0f172a;
      }

      .modal-btn:hover {
        transform: translateY(-3px);
      }

      /* RESPONSIVE */

      @media (max-width: 700px) {
        .logo {
          font-size: 1.5rem;
        }

        .note {
          width: 280px;
        }

        .modal-box {
          padding: 24px;
        }

        .modal-title {
          font-size: 1.6rem;
        }
      }
    </style>
  </head>

  <body>
    <!-- HEADER -->

    <header>
      <div class="header-container">
        <h1 class="logo">Tukka Sticky Notes</h1>

        <button class="add-note-btn" id="openModalBtn">
          <i class="fa-solid fa-plus"></i>
          Create Note
        </button>
      </div>
    </header>

    <!-- WORKSPACE -->

    <main class="workspace" id="workspace">
      <div class="empty-message" id="emptyMessage">
        <i class="fa-solid fa-note-sticky"></i>

        <h2>No Notes Available</h2>

        <p>Create your first sticky note.</p>
      </div>
    </main>

    <!-- MODAL -->

    <div class="modal" id="modal">
      <div class="modal-box">
        <h2 class="modal-title">Create Sticky Note</h2>

        <p class="modal-description">
          Add title, content and choose your favorite sticky note color.
        </p>

        <!-- TITLE -->

        <div class="form-group">
          <label> Note Title </label>

          <input type="text" id="noteTitle" placeholder="Enter note title..." />
        </div>

        <!-- CONTENT -->

        <div class="form-group">
          <label> Note Content </label>

          <textarea
            id="noteContent"
            placeholder="Write your note here..."
          ></textarea>
        </div>

        <!-- COLOR -->

        <div class="form-group">
          <label> Pick Note Color </label>

          <input type="color" id="noteColor" value="#fde68a" />
        </div>

        <!-- FOOTER -->

        <div class="modal-footer">
          <button class="modal-btn cancel-btn" id="closeModalBtn">
            Cancel
          </button>

          <button class="modal-btn save-btn" id="saveNoteBtn">Save Note</button>
        </div>
      </div>
    </div>

    <script>
      // ELEMENTS

      const workspace = document.getElementById("workspace");

      const modal = document.getElementById("modal");

      const openModalBtn = document.getElementById("openModalBtn");

      const closeModalBtn = document.getElementById("closeModalBtn");

      const saveNoteBtn = document.getElementById("saveNoteBtn");

      const noteTitle = document.getElementById("noteTitle");

      const noteContent = document.getElementById("noteContent");

      const noteColor = document.getElementById("noteColor");

      const emptyMessage = document.getElementById("emptyMessage");

      // NOTES ARRAY

      let notes = JSON.parse(localStorage.getItem("tukkaStickyNotes")) || [];

      // OPEN MODAL

      openModalBtn.addEventListener("click", () => {
        modal.classList.add("active");
      });

      // CLOSE MODAL

      function closeModal() {
        modal.classList.remove("active");

        noteTitle.value = "";

        noteContent.value = "";

        noteColor.value = "#fde68a";
      }

      closeModalBtn.addEventListener("click", closeModal);

      // CLOSE OUTSIDE

      modal.addEventListener("click", (event) => {
        if (event.target === modal) {
          closeModal();
        }
      });

      // SAVE LOCAL STORAGE

      function saveToLocalStorage() {
        localStorage.setItem("tukkaStickyNotes", JSON.stringify(notes));
      }

      // UPDATE EMPTY MESSAGE

      function updateEmptyMessage() {
        emptyMessage.style.display = notes.length === 0 ? "block" : "none";
      }

      // CREATE NOTE

      function createNote(note) {
        const noteElement = document.createElement("div");

        noteElement.classList.add("note");

        noteElement.style.background = note.color;

        noteElement.style.left = note.x + "px";

        noteElement.style.top = note.y + "px";

        noteElement.dataset.id = note.id;

        noteElement.innerHTML = `

        <div class="note-header">

          <input
          class="note-title"
          value="${note.title}" />

          <div class="note-actions">

            <button
            class="icon-btn edit-btn">

              <i class="fa-solid fa-pen"></i>

            </button>

            <button
            class="icon-btn delete-btn">

              <i class="fa-solid fa-trash"></i>

            </button>

          </div>

        </div>

        <textarea
        class="note-content">${note.content}</textarea>

        <div class="note-footer">

          <span class="time">

            ${note.time}

          </span>

          <input
          type="color"
          class="color-picker"
          value="${note.color}" />

        </div>

      `;

        workspace.appendChild(noteElement);

        // DELETE NOTE

        const deleteBtn = noteElement.querySelector(".delete-btn");

        deleteBtn.addEventListener("click", () => {
          notes = notes.filter((item) => item.id !== note.id);

          noteElement.remove();

          saveToLocalStorage();

          updateEmptyMessage();
        });

        // EDIT NOTE

        const titleInput = noteElement.querySelector(".note-title");

        const contentInput = noteElement.querySelector(".note-content");

        // AUTO SAVE

        function updateNote() {
          const target = notes.find((item) => item.id === note.id);

          target.title = titleInput.value;

          target.content = contentInput.value;

          saveToLocalStorage();
        }

        titleInput.addEventListener("input", updateNote);

        contentInput.addEventListener("input", updateNote);

        // COLOR PICKER

        const colorPicker = noteElement.querySelector(".color-picker");

        colorPicker.addEventListener("input", () => {
          noteElement.style.background = colorPicker.value;

          const target = notes.find((item) => item.id === note.id);

          target.color = colorPicker.value;

          saveToLocalStorage();
        });

        // DRAG & DROP

        let isDragging = false;

        let offsetX = 0;

        let offsetY = 0;

        noteElement.addEventListener("mousedown", (event) => {
          if (
            event.target.tagName === "TEXTAREA" ||
            event.target.tagName === "INPUT" ||
            event.target.closest("button")
          )
            return;

          isDragging = true;

          offsetX = event.clientX - noteElement.offsetLeft;

          offsetY = event.clientY - noteElement.offsetTop;
        });

        document.addEventListener("mousemove", (event) => {
          if (!isDragging) return;

          noteElement.style.left = event.clientX - offsetX + "px";

          noteElement.style.top = event.clientY - offsetY + "px";
        });

        document.addEventListener("mouseup", () => {
          if (isDragging) {
            const target = notes.find((item) => item.id === note.id);

            target.x = noteElement.offsetLeft;

            target.y = noteElement.offsetTop;

            saveToLocalStorage();
          }

          isDragging = false;
        });
      }

      // SAVE NOTE BUTTON

      saveNoteBtn.addEventListener("click", () => {
        if (noteTitle.value.trim() === "" || noteContent.value.trim() === "") {
          alert("Please fill all fields");

          return;
        }

        const now = new Date();

        const note = {
          id: Date.now(),

          title: noteTitle.value,

          content: noteContent.value,

          color: noteColor.value,

          time: now.toLocaleString(),

          x: Math.random() * 400,

          y: Math.random() * 250,
        };

        notes.push(note);

        saveToLocalStorage();

        createNote(note);

        updateEmptyMessage();

        closeModal();
      });

      // LOAD SAVED NOTES

      notes.forEach((note) => {
        createNote(note);
      });

      updateEmptyMessage();
    </script>
  </body>
</html>
