<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tukka Image Slider</title>

    <!-- Favicon -->
    <link
      rel="icon"
      href="https://raw.githubusercontent.com/itzDM/publicAssets/refs/heads/main/favicon.ico"
    />

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>

  <body>
    <!-- SLIDER -->

    <div class="slider-container">
      <div class="slider">
        <div id="slide-container">
          <!-- Modify Below Start -->
          <div class="slide">
            <img
              src="https://img.freepik.com/premium-photo/background-concept-with-abstract-data-design_327072-24787.jpg"
              alt="Image src change and alt text change"
            />
            <div class="overlay">
              <div class="content">
                <span class="tag">Tag Here</span>
                <h2>Title Here</h2>
                <p>Image Description Here</p>
              </div>
            </div>
          </div>
          <!-- Modify  End -->
        </div>
        <!-- BUTTONS -->

        <button class="nav-btn prev-btn">
          <i class="fa-solid fa-angle-left"></i>
        </button>

        <button class="nav-btn next-btn">
          <i class="fa-solid fa-angle-right"></i>
        </button>
      </div>
    </div>
    <footer>
      <p>
        Made for Learners |
        <a href="https://tukkalearn.vercel.app/" target="_blank">Tukka Learn</a>
      </p>
      <p>Made by || सीता राम जी ||</p>
      <p class="copyright"></p>
      <p>|| राम नाम सत्य है ||</p>
    </footer>
  </body>
</html>
