<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      href="https://raw.githubusercontent.com/itzDM/publicAssets/refs/heads/main/favicon.ico"
    />

    <title>Tukka Multi Theme Website</title>

    <!-- GOOGLE FONT -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- FONT AWESOME -->

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <link rel="stylesheet" href="style.css" />

    <script src="script.js" defer></script>
  </head>

  <body>
    <!-- MAIN -->

    <main class="theme-container">
      <!-- HERO -->

      <section class="hero-section">
        <span class="badge">
          <i class="fa-solid fa-palette"></i>
          Multi Theme Website
        </span>

        <h1>Tukka Theme Studio</h1>
      </section>

      <!-- CARD -->

      <section class="theme-card">
        <!-- TOP -->

        <div class="card-header">
          <div>
            <h2>Customize Theme</h2>

            <p>Select colors and personalize your UI</p>
          </div>

          <button id="resetBtn" class="reset-btn">
            <i class="fa-solid fa-rotate-left"></i>
            Reset
          </button>
        </div>

        <!-- COLOR PICKERS -->

        <div class="theme-grid">
          <!-- BG -->

          <div class="theme-box">
            <div class="theme-info">
              <div class="icon bg-icon">
                <i class="fa-solid fa-fill-drip"></i>
              </div>

              <h3>Background Color</h3>
            </div>

            <input type="color" id="bgColor" value="#0f172a" />
          </div>

          <!-- TEXT -->

          <div class="theme-box">
            <div class="theme-info">
              <div class="icon text-icon">
                <i class="fa-solid fa-font"></i>
              </div>

              <h3>Text Color</h3>
            </div>

            <input type="color" id="textColor" value="#ffffff" />
          </div>
        </div>

        <!-- ACTIONS -->

        <div class="action-buttons">
          <button id="applyBtn" class="primary-btn">
            <i class="fa-solid fa-wand-magic-sparkles"></i>

            Apply Theme
          </button>
        </div>
      </section>
    </main>

    <!-- FOOTER -->
    <footer>
      <p>
        Made for Learners |
        <a href="https://tukkalearn.vercel.app/" target="_blank">Tukka Learn</a>
      </p>
      <p>Made with ❤️ by || सीता राम जी ||</p>
      <p class="copyright"></p>
      <p>|| राम नाम सत्य है ||</p>
    </footer>
  </body>
</html>
