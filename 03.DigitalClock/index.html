<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title -->
    <title>Tukka Digital Clock</title>

    <!-- Favicon -->
    <link
      rel="icon"
      href="https://raw.githubusercontent.com/itzDM/publicAssets/refs/heads/main/favicon.ico"
    />

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0f172a, #111827, #1e293b);
        overflow: hidden;
        position: relative;
        color: white;
      }

      /* BACKGROUND GLOW */

      body::before {
        content: "";
        position: absolute;
        width: 350px;
        height: 350px;
        background: #38bdf8;
        border-radius: 50%;
        top: -100px;
        left: -100px;
        filter: blur(120px);
        opacity: 0.35;
      }

      body::after {
        content: "";
        position: absolute;
        width: 300px;
        height: 300px;
        background: #8b5cf6;
        border-radius: 50%;
        bottom: -100px;
        right: -100px;
        filter: blur(120px);
        opacity: 0.35;
      }

      /* CLOCK CARD */

      .clock-card {
        width: 90%;
        max-width: 600px;
        padding: 50px 35px;
        border-radius: 30px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(18px);
        text-align: center;
        position: relative;
        z-index: 10;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      }

      .clock-badge {
        display: inline-block;
        padding: 8px 18px;
        border-radius: 50px;
        background: rgba(56, 189, 248, 0.15);
        color: #38bdf8;
        font-size: 0.9rem;
        margin-bottom: 20px;
        letter-spacing: 1px;
      }

      h1 {
        font-size: 2.5rem;
        margin-bottom: 18px;
        font-weight: 700;
      }

      .clock {
        font-size: 4rem;
        font-weight: 700;
        color: #38bdf8;
        margin-bottom: 20px;
        letter-spacing: 3px;
      }

      .date {
        font-size: 1.1rem;
        color: #cbd5e1;
        margin-bottom: 30px;
      }

      .info-box {
        display: flex;
        justify-content: center;
        gap: 20px;
        flex-wrap: wrap;
      }

      .info {
        min-width: 120px;
        padding: 18px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .info h3 {
        font-size: 0.9rem;
        color: #94a3b8;
        margin-bottom: 8px;
        font-weight: 500;
      }

      .info p {
        font-size: 1.2rem;
        font-weight: 600;
      }

      /* RESPONSIVE */

      @media (max-width: 700px) {
        .clock-card {
          padding: 40px 20px;
        }

        h1 {
          font-size: 2rem;
        }

        .clock {
          font-size: 2.8rem;
        }
      }

      @media (max-width: 480px) {
        h1 {
          font-size: 1.7rem;
        }

        .clock {
          font-size: 2.2rem;
          letter-spacing: 1px;
        }

        .date {
          font-size: 1rem;
        }
      }
    </style>
  </head>

  <body>
    <main class="clock-card">
      <span class="clock-badge"> Tukka Digital Clock </span>

      <h1>Current Date & Time</h1>

      <h2 class="clock" id="clock">00:00:00</h2>

      <p class="date" id="date">Monday, January 1, 2026</p>

      <div class="info-box">
        <div class="info">
          <h3>Timezone</h3>
          <p>IST</p>
        </div>

        <div class="info">
          <h3>Format</h3>
          <p>12 Hour</p>
        </div>

        <div class="info">
          <h3>Status</h3>
          <p>Running</p>
        </div>
      </div>
    </main>

    <script>
      const clock = document.getElementById("clock");
      const date = document.getElementById("date");

      function updateClock() {
        const now = new Date();

        // TIME

        const time = now.toLocaleTimeString();

        // DATE

        const fullDate = now.toLocaleDateString("en-US", {
          weekday: "long",
          year: "numeric",
          month: "long",
          day: "numeric",
        });

        clock.innerText = time;
        date.innerText = fullDate;
      }

      updateClock();

      setInterval(updateClock, 1000);
    </script>
  </body>
</html>
